name: Release

# A tag v<version> (from scripts/release.mjs) builds the Windows installer and
# the macOS disk image, and drafts one release with the updater files;
# docs/RELEASING.md says how to publish it.
# Run by hand, it only builds them, as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One platform at a time: each adds its files, and its entries of
      # latest.json, to the same draft release.
      max-parallel: 1
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundle: nsis
          - name: macos
            os: macos-latest # Apple Silicon
            bundle: dmg
    # The update signing key is given to the build steps only: never to the
    # dependencies' install scripts or the tests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # The same checks as CI: a tag may be pushed from a commit CI never ran on.
      # Windows only: the macOS checks run in CI, and a build that does not compile
      # on macOS fails here anyway.
      - name: Types
        if: matrix.name == 'windows'
        run: pnpm exec tsc --noEmit
      - name: Interface tests
        if: matrix.name == 'windows'
        run: pnpm test
      - name: Rust format
        if: matrix.name == 'windows'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust lints
        if: matrix.name == 'windows'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        if: matrix.name == 'windows'
        working-directory: src-tauri
        run: cargo test

      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          {
            echo 'body<<END_OF_NOTES'
            node scripts/release-notes.mjs "$GITHUB_REF_NAME"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"
      - name: Build and draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: dummyPlane __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # A pre-release would not be "latest", and the updater reads latest.json from the latest release.
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Keep the installer
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dummyplane-${{ matrix.name }}
          path: src-tauri/target/release/bundle/${{ matrix.bundle }}/*

  # Once every platform has added its files, latest.json lists them all.
  finalize:
    name: Point latest.json at the download links
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # A draft's latest.json points at API asset URLs: rate-limited, and
      # fragile behind proxies. The release's download links work once published.
      - name: Rewrite latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --output latest.json --clobber
          gh release view "$GITHUB_REF_NAME" --json assets > assets.json
          node scripts/updater-json.mjs latest.json assets.json "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
