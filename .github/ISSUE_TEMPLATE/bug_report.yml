name: Bug report
description: Something in dummyPlane does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        For a security problem, do not open an issue: follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch a group of 4 Claude agents
        2. Send "@frontend /context"
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dummyPlane version or commit
      placeholder: 0.1.0 (from About dummyPlane in the command palette), or the commit you built
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent CLI and version, if relevant
      placeholder: Claude Code, Codex, Gemini CLI or Qwen Code, with its version
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: |
        In dummyPlane, press Ctrl+Shift+P and choose "Open the logs folder", or go to
        `%LOCALAPPDATA%\dev.dummyplane.app\logs`. Drag `dummyplane.log` here. It holds no token and no terminal text.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Please remove any secret, token or private path before you paste terminal output.
